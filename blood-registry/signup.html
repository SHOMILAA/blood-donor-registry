<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Create Account</h2>
    <form id="signupForm">
      <input type="text" id="name" class="input" placeholder="Full Name" required>
      <input type="email" id="email" class="input" placeholder="Email" required>
      <input type="password" id="password" class="input" placeholder="Password" required>

      <label>Role:</label>
      <select id="role" class="input" required>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" id="signupBtn" class="btn">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script type="module">
    import { app, auth } from "./firebase.js";
    import { getFirestore, doc, setDoc } 
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { createUserWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const db = getFirestore(app);

    // ✅ Enable Enter key to jump to next field
    const inputs = document.querySelectorAll("#signupForm input, #signupForm select");
    inputs.forEach((input, index) => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault(); // stop default submit
          const next = inputs[index + 1];
          if (next) {
            next.focus(); // jump to next input
          } else {
            document.getElementById("signupBtn").click(); // submit if last field
          }
        }
      });
    });

    // ✅ Handle Sign Up
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", userCred.user.uid), { name, email, role });
        alert("✅ Account created! You can now log in.");
        window.location.href = "login.html";
      } catch (error) {
        alert("❌ Error: " + error.message);
      }
    });
  </script>
</body>
</html>
